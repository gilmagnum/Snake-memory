<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>שביל הנחש — משחק זיכרון</title>
<style>
  html, body { overflow-x: hidden; }
  :root {
    --bg: #eaf2fd;
    --panel: #ffffff;
    --border: #cfe0f6;
    --grid-line: #d9e6f7;
    --blue: #2f6fed;
    --blue-dim: #e3ecfc;
    --blue-glow: rgba(47, 111, 237, 0.28);
    --danger: #e0433f;
    --danger-glow: rgba(224, 67, 63, 0.3);
    --gray: #9aa7ba;
    --gray-glow: rgba(154, 167, 186, 0.35);
    --text: #1f2b3d;
    --text-dim: #7688a6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', 'Heebo', Arial, sans-serif;
    direction: rtl;
    width: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;   /* fallback for browsers without dvh support */
    min-height: 100dvh;  /* actual visible height on mobile, ignores the collapsing address bar */
  }

  .console {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(47, 111, 237, 0.12), 0 2px 8px rgba(31, 43, 61, 0.06);
    padding: 20px 20px 24px;
    position: relative;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--blue-dim);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }

  .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--blue);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stage-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .sound-toggle {
    background: var(--blue-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    color: var(--blue);
  }
  .sound-toggle:hover { background: #d5e3fb; }

  .hud {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .lives {
    display: flex;
    gap: 6px;
    font-size: 18px;
  }
  .life-icon { color: var(--danger); }
  .life-icon.lost { color: #dbe3ee; }

  .message {
    min-height: 20px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-align: center;
    font-weight: 500;
    transition: color 0.2s;
  }
  .message.win { color: var(--blue); font-weight: 700; }
  .message.fail { color: var(--danger); font-weight: 700; }

  .timer-track {
    height: 4px;
    background: var(--blue-dim);
    border-radius: 3px;
    margin: 0 auto 14px;
    max-width: 220px;
    overflow: hidden;
    visibility: hidden;
  }
  .timer-track.active { visibility: visible; }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: var(--blue);
    transform-origin: right center;
  }

  .grid-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .grid-stage {
    position: relative;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .grid {
    display: grid;
    gap: 6px;
    position: relative;
    z-index: 1;
  }

  .path-overlay {
    position: absolute;
    top: 0; right: 0;
    left: 0; bottom: 0;
    pointer-events: none;
    z-index: 2;
  }

  .path-overlay polyline {
    fill: none;
    stroke: var(--blue);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px var(--blue-glow));
    transition: stroke 0.1s;
  }
  .path-overlay polyline.wrong-flash {
    stroke: var(--danger);
    filter: drop-shadow(0 0 4px var(--danger-glow));
  }
  .path-overlay polyline.muted {
    stroke: var(--gray);
    filter: drop-shadow(0 0 3px var(--gray-glow));
  }

  .path-overlay circle {
    fill: var(--blue);
    filter: drop-shadow(0 0 3px var(--blue-glow));
  }
  .path-overlay circle.wrong-flash {
    fill: var(--danger);
    filter: drop-shadow(0 0 4px var(--danger-glow));
  }
  .path-overlay circle.muted {
    fill: var(--gray);
    filter: drop-shadow(0 0 3px var(--gray-glow));
  }

  .cell {
    width: 46px;
    height: 46px;
    background: #f5f9fe;
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    position: relative;
  }

  .controls {
    display: flex;
    justify-content: center;
  }

  button.primary {
    background: var(--blue);
    border: 1px solid var(--blue);
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 11px 28px;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px var(--blue-glow);
    transition: filter 0.15s, transform 0.08s;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:active { transform: translateY(1px); }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 14px;
    line-height: 1.7;
  }
  .footnote b { color: var(--blue); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="console" dir="rtl">
  <header>
    <span class="title">שביל הנחש</span>
    <div class="header-right">
      <span class="stage-label" id="stageLabel">שלב 1</span>
      <button class="sound-toggle" id="soundToggle" title="השתק/הפעל צלילים">🔊</button>
    </div>
  </header>

  <div class="hud">
    <div class="lives" id="lives"></div>
  </div>

  <div class="message" id="message">לחצו התחל כדי לראות את התבנית</div>
  <div class="timer-track" id="timerTrack"><div class="timer-fill" id="timerFill"></div></div>

  <div class="grid-wrap">
    <div class="grid-stage" id="gridStage">
      <div class="grid" id="grid"></div>
      <svg class="path-overlay" id="overlay"></svg>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="actionBtn">התחל</button>
  </div>

  <div class="footnote">
    התבנית מוצגת 5 שניות כקו בין מרכזי המשבצות, עם עיגול בכל אחד משני הקצוות.<br>
    לשחזור: <b>גררו</b> על המשבצות באותו רצף, מכל אחד משני הכיוונים.<br>
    טעות עולה חיים אחד, אבל התבנית לא מתחלפת — מנסים שוב עד הצלחה או עד שנגמרים החיים.
  </div>
</div>

<script>
(function () {
  const gridEl = document.getElementById('grid');
  const gridStageEl = document.getElementById('gridStage');
  const overlayEl = document.getElementById('overlay');
  const messageEl = document.getElementById('message');
  const livesEl = document.getElementById('lives');
  const stageLabelEl = document.getElementById('stageLabel');
  const actionBtn = document.getElementById('actionBtn');
  const timerTrackEl = document.getElementById('timerTrack');
  const timerFillEl = document.getElementById('timerFill');
  const soundToggleEl = document.getElementById('soundToggle');

  let CELL = 46;
  const MIN_CELL = 26;
  const MAX_CELL = 46;
  const GAP = 6;
  const MAX_LIVES = 5;
  const START_LIVES = 5;
  const START_GRID = 4;
  const MAX_GRID = 8;
  const LEVELS_PER_SIZE = 3;
  const REVEAL_MS = 5000;

  let level = 1;
  let lives = START_LIVES;
  let gridSize = 4;
  let path = [];              // array of {r,c} — no directional meaning, fixed until level changes
  let activeSequence = null;  // path or reversed path, locked in on first touch of an attempt
  let pathIndex = 0;
  let drawnPts = [];          // pixel centers of confirmed cells, for the live line
  let isDragging = false;
  let lastCellKey = null;
  let centersMap = {};        // key(r,c) -> {x,y} measured from actual rendered layout
  let state = 'idle';         // idle | showing | input | locked

  // ---------- sound ----------
  let audioCtx = null;
  let soundOn = true;

  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, opts) {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    opts = opts || {};
    const type = opts.type || 'sine';
    const volume = opts.volume != null ? opts.volume : 0.16;
    const delay = opts.delay || 0;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  const sfx = {
    tick: () => playTone(1000, 0.06, { type: 'sine', volume: 0.1 }),
    step: () => playTone(620, 0.07, { type: 'sine', volume: 0.15 }),
    wrong: () => {
      playTone(230, 0.13, { type: 'square', volume: 0.16 });
      playTone(160, 0.16, { type: 'square', volume: 0.14, delay: 0.1 });
    },
    success: () => {
      playTone(523, 0.1, { type: 'triangle', volume: 0.15 });
      playTone(659, 0.1, { type: 'triangle', volume: 0.15, delay: 0.09 });
      playTone(784, 0.18, { type: 'triangle', volume: 0.17, delay: 0.18 });
    },
    gameover: () => {
      playTone(392, 0.2, { type: 'sawtooth', volume: 0.12 });
      playTone(330, 0.2, { type: 'sawtooth', volume: 0.12, delay: 0.18 });
      playTone(247, 0.32, { type: 'sawtooth', volume: 0.14, delay: 0.36 });
    },
    click: () => playTone(760, 0.05, { type: 'sine', volume: 0.1 })
  };

  soundToggleEl.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggleEl.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) ensureAudio();
  });

  function gridSizeForLevel(lvl) {
    return Math.min(START_GRID + Math.floor((lvl - 1) / LEVELS_PER_SIZE), MAX_GRID);
  }

  function computeCellSize(size) {
    const wrap = gridStageEl.parentElement; // .grid-wrap — width is stable regardless of content
    const available = (wrap && wrap.clientWidth) ? wrap.clientWidth : 400;
    let cell = Math.floor((available - (size - 1) * GAP) / size);
    cell = Math.max(MIN_CELL, Math.min(MAX_CELL, cell));
    return cell;
  }
  function pathLengthForLevel(lvl, size) {
    const maxLen = size * size - 1;
    return Math.min(3 + lvl, maxLen);
  }

  function key(r, c) { return r + '_' + c; }

  function buildGridDOM(size) {
    CELL = computeCellSize(size);
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${size}, ${CELL}px)`;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = CELL + 'px';
        cell.style.height = CELL + 'px';
        cell.dataset.r = r;
        cell.dataset.c = c;
        gridEl.appendChild(cell);
      }
    }
    const pixelSize = size * CELL + (size - 1) * GAP;
    overlayEl.setAttribute('width', pixelSize);
    overlayEl.setAttribute('height', pixelSize);
    overlayEl.setAttribute('viewBox', `0 0 ${pixelSize} ${pixelSize}`);
    overlayEl.innerHTML = '';

    // measure actual rendered positions (robust against RTL grid flow)
    centersMap = {};
    document.querySelectorAll('.cell').forEach(el => {
      const r = el.dataset.r, c = el.dataset.c;
      centersMap[key(r, c)] = {
        x: el.offsetLeft + el.offsetWidth / 2,
        y: el.offsetTop + el.offsetHeight / 2
      };
    });
  }

  function centerOf(r, c) {
    return centersMap[key(r, c)];
  }

  function generatePath(size, length) {
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    let attempts = 0;
    while (attempts < 400) {
      attempts++;
      const startR = Math.floor(Math.random() * size);
      const startC = Math.floor(Math.random() * size);
      const visited = new Set([key(startR, startC)]);
      const p = [{ r: startR, c: startC }];
      let ok = true;
      while (p.length < length) {
        const cur = p[p.length - 1];
        const options = dirs
          .map(([dr, dc]) => ({ r: cur.r + dr, c: cur.c + dc }))
          .filter(n => n.r >= 0 && n.r < size && n.c >= 0 && n.c < size && !visited.has(key(n.r, n.c)));
        if (options.length === 0) { ok = false; break; }
        const next = options[Math.floor(Math.random() * options.length)];
        p.push(next);
        visited.add(key(next.r, next.c));
      }
      if (ok && p.length === length) return p;
    }
    return generatePath(size, Math.max(3, length - 1));
  }

  function renderLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const span = document.createElement('span');
      span.className = 'life-icon' + (i < lives ? '' : ' lost');
      span.textContent = '♥';
      livesEl.appendChild(span);
    }
  }

  function setMessage(text, cls) {
    messageEl.textContent = text;
    messageEl.className = 'message' + (cls ? ' ' + cls : '');
  }

  function startLevel() {
    gridSize = gridSizeForLevel(level);
    const length = pathLengthForLevel(level, gridSize);
    buildGridDOM(gridSize);
    path = generatePath(gridSize, length);
    activeSequence = null;
    pathIndex = 0;
    drawnPts = [];
    stageLabelEl.textContent = 'שלב ' + level;
    renderLives();
    actionBtn.style.visibility = 'hidden';
    state = 'showing';
    showPattern();
  }

  function drawStaticPattern(muted) {
    const ns = 'http://www.w3.org/2000/svg';
    overlayEl.innerHTML = '';
    const poly = document.createElementNS(ns, 'polyline');
    if (muted) poly.setAttribute('class', 'muted');
    const pts = path.map(p => {
      const { x, y } = centerOf(p.r, p.c);
      return `${x},${y}`;
    }).join(' ');
    poly.setAttribute('points', pts);
    overlayEl.appendChild(poly);

    [path[0], path[path.length - 1]].forEach(p => {
      const { x, y } = centerOf(p.r, p.c);
      const circle = document.createElementNS(ns, 'circle');
      if (muted) circle.setAttribute('class', 'muted');
      circle.setAttribute('cx', x);
      circle.setAttribute('cy', y);
      circle.setAttribute('r', 6);
      overlayEl.appendChild(circle);
    });
  }

  function showPattern() {
    drawStaticPattern(false);

    let secondsLeft = Math.round(REVEAL_MS / 1000);
    setMessage('שננו את התבנית... ' + secondsLeft);
    sfx.tick();
    timerTrackEl.classList.add('active');
    timerFillEl.style.transition = 'none';
    timerFillEl.style.transform = 'scaleX(1)';
    void timerFillEl.offsetWidth;
    timerFillEl.style.transition = `transform ${REVEAL_MS}ms linear`;
    timerFillEl.style.transform = 'scaleX(0)';

    const tick = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0) {
        setMessage('שננו את התבנית... ' + secondsLeft);
        sfx.tick();
      }
    }, 1000);

    setTimeout(() => {
      clearInterval(tick);
      timerTrackEl.classList.remove('active');
      overlayEl.innerHTML = '';
      beginInputPhase();
    }, REVEAL_MS);
  }

  function beginInputPhase() {
    state = 'input';
    pathIndex = 0;
    activeSequence = null;
    drawnPts = [];
    lastCellKey = null;
    setMessage('גררו את הרצף שזכרתם — מכל כיוון');
  }

  function updateDrawnLine() {
    let poly = overlayEl.querySelector('polyline.drawn');
    if (!poly) {
      const ns = 'http://www.w3.org/2000/svg';
      poly = document.createElementNS(ns, 'polyline');
      poly.setAttribute('class', 'drawn');
      overlayEl.appendChild(poly);
    }
    poly.setAttribute('points', drawnPts.map(p => `${p.x},${p.y}`).join(' '));

    let cursor = overlayEl.querySelector('circle.cursor');
    if (!cursor) {
      const ns = 'http://www.w3.org/2000/svg';
      cursor = document.createElementNS(ns, 'circle');
      cursor.setAttribute('class', 'cursor');
      cursor.setAttribute('r', 6);
      overlayEl.appendChild(cursor);
    }
    const last = drawnPts[drawnPts.length - 1];
    cursor.setAttribute('cx', last.x);
    cursor.setAttribute('cy', last.y);
  }

  function processCell(el) {
    if (state !== 'input' || !el || !el.classList.contains('cell')) return;
    const r = parseInt(el.dataset.r, 10);
    const c = parseInt(el.dataset.c, 10);
    const k = key(r, c);
    if (k === lastCellKey) return; // already processed this cell during the drag
    lastCellKey = k;

    if (pathIndex === 0 && activeSequence === null) {
      const isStart = r === path[0].r && c === path[0].c;
      const isEnd = r === path[path.length - 1].r && c === path[path.length - 1].c;
      if (isStart) activeSequence = path;
      else if (isEnd) activeSequence = path.slice().reverse();
      else { failAttempt(centerOf(r, c)); return; }
    }

    const expected = activeSequence[pathIndex];
    if (r === expected.r && c === expected.c) {
      drawnPts.push(centerOf(r, c));
      updateDrawnLine();
      sfx.step();
      pathIndex++;
      if (pathIndex === activeSequence.length) {
        isDragging = false;
        succeedLevel();
      }
    } else {
      failAttempt(centerOf(r, c));
    }
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (state === 'input' && pathIndex > 0 && activeSequence && pathIndex < activeSequence.length) {
      failAttempt(null);
    }
  }

  function flashWrong(wrongPoint, cb) {
    const ns = 'http://www.w3.org/2000/svg';
    const poly = overlayEl.querySelector('polyline.drawn');
    if (poly) poly.classList.add('wrong-flash');
    if (wrongPoint) {
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('class', 'wrong-flash');
      circle.setAttribute('cx', wrongPoint.x);
      circle.setAttribute('cy', wrongPoint.y);
      circle.setAttribute('r', 6);
      overlayEl.appendChild(circle);
    }
    setTimeout(cb, 450);
  }

  function failAttempt(wrongPoint) {
    if (state !== 'input') return;
    state = 'locked';
    isDragging = false;
    sfx.wrong();

    flashWrong(wrongPoint, () => {
      lives--;
      renderLives();
      if (lives <= 0) {
        drawStaticPattern(true); // reveal the unsolved pattern in gray
        setMessage('נגמרו החיים. זו הייתה התבנית שלא הצלחתם לשחזר', 'fail');
        sfx.gameover();
        actionBtn.textContent = 'התחלה מחדש';
        actionBtn.style.visibility = 'visible';
        actionBtn.onclick = () => { sfx.click(); resetGame(); };
      } else {
        overlayEl.innerHTML = '';
        setMessage('לא מדויק — נסו שוב, אותה תבנית. נשארו ' + lives + ' חיים', 'fail');
        pathIndex = 0;
        activeSequence = null;
        drawnPts = [];
        lastCellKey = null;
        state = 'input';
      }
    });
  }

  function succeedLevel() {
    state = 'locked';
    lives = Math.min(MAX_LIVES, lives + 1);
    renderLives();
    setMessage('מדויק! חיים חוזר ← שלב הבא', 'win');
    sfx.success();
    level++;
    actionBtn.textContent = 'לשלב הבא';
    actionBtn.style.visibility = 'visible';
    actionBtn.onclick = () => { sfx.click(); startLevel(); };
  }

  function resetGame() {
    level = 1;
    lives = START_LIVES;
    startLevel();
  }

  // --- pointer/drag wiring (mouse + touch) ---
  gridStageEl.addEventListener('mousedown', (e) => {
    if (state !== 'input') return;
    const el = e.target.closest('.cell');
    if (!el) return;
    isDragging = true;
    lastCellKey = null;
    processCell(el);
  });
  gridStageEl.addEventListener('mouseover', (e) => {
    if (!isDragging) return;
    const el = e.target.closest('.cell');
    if (el) processCell(el);
  });
  document.addEventListener('mouseup', endDrag);

  gridStageEl.addEventListener('touchstart', (e) => {
    if (state !== 'input') return;
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const cellEl2 = el && el.closest ? el.closest('.cell') : null;
    if (!cellEl2) return;
    e.preventDefault();
    isDragging = true;
    lastCellKey = null;
    processCell(cellEl2);
  }, { passive: false });

  gridStageEl.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const cellEl2 = el && el.closest ? el.closest('.cell') : null;
    if (cellEl2) processCell(cellEl2);
  }, { passive: false });

  document.addEventListener('touchend', endDrag);
  document.addEventListener('touchcancel', endDrag);

  actionBtn.onclick = () => { sfx.click(); startLevel(); };
  renderLives();
})();
</script>

</body>
</html>
